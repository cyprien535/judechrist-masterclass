  <path d="M22 18H42C44.2091 18 46 19.7909 46 22V28C44.3431 28 43 29.3431 43 31C43 32.6569 44.3431 34 46 34V42C46 44.2091 44.2091 46 42 46H22C19.7909 46 18 44.2091 18 42V34C19.6569 34 21 32.6569 21 31C21 29.3431 19.6569 28 18 28V22C18 19.7909 19.7909 18 22 18Z" fill="url(#accentGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Star Sparkle in Center -->
  <path d="M32 23L34.2 28.8L40 31L34.2 33.2L32 39L29.8 33.2L24 31L29.8 28.8L32 23Z" fill="url(#goldGrad)"/>
